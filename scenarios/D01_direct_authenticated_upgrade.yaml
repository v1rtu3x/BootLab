id: D01
name: direct-authenticated-v2-upgrade
category: baseline
profile: mcuboot_overwrite_reference
primary:
  name: v1.0.0-trusted
  version: 1.0.0
  trusted: true
secondary:
  name: v2.0.0-trusted
  version: 2.0.0
  trusted: true
operation: stage_then_upgrade
backend: mcuboot_sim
backend_args:
  cargo_test: bootlab_direct_image
  cargo_features: sig-ecdsa overwrite-only
  primary_image: v1.0.0-trusted.signed.bin
  candidate_image: v2.0.0-trusted.signed.bin
  expected_selection: candidate
  key_type: ecdsa-p256
fault:
  type: none
expect:
  outcome_in: [new_authenticated_image]
  booted_version: "2.0.0"
notes: "Injects both declared corpus images into MCUboot's nrf52840 simulator slots and observes image selection."
