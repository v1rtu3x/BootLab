id: P02
name: stage-and-upgrade-v2-trusted
category: baseline
profile: mcuboot_swap_reference
primary:
  name: v1.0.0-trusted
  version: 1.0.0
  trusted: true
secondary:
  name: v2.0.0-trusted
  version: 2.0.0
  trusted: true
operation: stage_then_upgrade
backend: mcuboot_sim
backend_args:
  cargo_test: basic_revert
  cargo_features: sig-ecdsa
fault:
  type: none
expect:
  invalid_image_booted: false
  outcome_in:
    - new_authenticated_image
  booted_version: "2.0.0"
notes: |
  Proxy for a valid upgrade path. The upstream basic_revert test boots v1,
  stages v2, and boots v2. Our corpus supplies equivalent signed images.
