id: F04
name: swap-interruption-at-operation-index-300
category: fault
profile: mcuboot_swap_reference
primary:
  name: v1.0.0-trusted
  version: 1.0.0
  trusted: true
secondary:
  name: v2.0.0-trusted
  version: 2.0.0
  trusted: true
operation: stage_then_upgrade
backend: mcuboot_sim
backend_args:
  cargo_test: fault_campaign_upgrade
  cargo_features: sig-ecdsa
  env:
    FAULT_INDEX: "300"
fault:
  type: reset
  point: before_counted_operation_300
  index: 300
expect:
  invalid_image_booted: false
  outcome_in:
    - old_authenticated_image
    - new_authenticated_image
notes: |
  Interrupt before modeled operation 300, which is within the common reachable
  range for all simulator configurations. The simulator does not identify this
  numeric index as a trailer metadata write.
