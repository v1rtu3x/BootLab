id: V02
name: downgrade-prevention-disabled-allows-older-control
category: version
profile: mcuboot_overwrite_reference
primary:
  name: v2.0.0-trusted
  version: 2.0.0
  trusted: true
secondary:
  name: v1.5.0-trusted
  version: 1.5.0
  trusted: true
operation: stage_then_upgrade
backend: mcuboot_sim
backend_args:
  cargo_test: downgrade_prevention
  cargo_features: "sig-ecdsa overwrite-only"
fault:
  type: none
expect:
  invalid_image_booted: false
  outcome_in:
    - old_authenticated_image
notes: |
  Equivalent overwrite-only control with downgrade prevention disabled. The
  intended result is acceptance of the older authenticated candidate, but the
  upstream proxy does not report the observed image/version, so this case is
  reported as SKIP pending direct behavioral integration.
