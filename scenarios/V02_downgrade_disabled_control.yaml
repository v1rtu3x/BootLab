id: V02
name: downgrade-prevention-disabled-allows-older-control
category: version
profile: mcuboot_overwrite_reference
primary:
  name: v2.0.0-trusted
  version: 2.0.0
  trusted: true
secondary:
  name: v1.5.0-trusted
  version: 1.5.0
  trusted: true
operation: stage_then_upgrade
backend: mcuboot_sim
backend_args:
  cargo_test: bootlab_direct_image
  cargo_features: "sig-ecdsa overwrite-only"
  primary_image: v2.0.0-trusted.signed.bin
  candidate_image: v1.5.0-trusted.signed.bin
  expected_selection: candidate
  key_type: ecdsa-p256
fault:
  type: none
expect:
  invalid_image_booted: false
  outcome_in:
    - old_authenticated_image
  booted_version: "1.5.0"
notes: |
  Uses the exact same authenticated image bytes as V01 with downgrade
  prevention disabled and asserts MCUboot selects the older candidate.
