id: F01
name: swap-no-cut-baseline
category: fault
profile: mcuboot_swap_reference
primary:
  name: v1.0.0-trusted
  version: 1.0.0
  trusted: true
secondary:
  name: v2.0.0-trusted
  version: 2.0.0
  trusted: true
operation: stage_then_upgrade
backend: mcuboot_sim
backend_args:
  cargo_test: fault_campaign_upgrade
  cargo_features: sig-ecdsa
  env:
    FAULT_INDEX: "0"
fault:
  type: reset
  point: no_cut_baseline
  index: 0
expect:
  invalid_image_booted: false
  outcome_in:
    - old_authenticated_image
    - new_authenticated_image
  booted_version: "1.0.0"
notes: |
  FAULT_INDEX=0 disables injection in the pinned simulator. This is a
  completed-upgrade baseline, not a reset before the first write.
