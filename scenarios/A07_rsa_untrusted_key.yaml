category: authenticity
profile: mcuboot_swap_rsa2048_reference
secondary:
  name: v2.0.0-untrusted-rsa2048
  version: 2.0.0
  trusted: false
operation: stage_then_upgrade
backend: imgtool_verify
backend_args:
  image: v2.0.0-untrusted-rsa2048.signed.bin
  key_id: dev-trusted
  key_type: rsa-2048
fault:
  type: none
expect:
  invalid_image_booted: false
