id: F01O
name: overwrite-reset-before-any-destination-write
category: fault
profile: mcuboot_overwrite_reference
primary:
  name: v1.0.0-trusted
  version: 1.0.0
  trusted: true
secondary:
  name: v2.0.0-trusted
  version: 2.0.0
  trusted: true
operation: stage_then_upgrade
backend: mcuboot_sim
backend_args:
  cargo_test: fault_campaign_upgrade
  cargo_features: "sig-ecdsa overwrite-only"
