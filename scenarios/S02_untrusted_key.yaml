id: S02
name: untrusted-key-image-rejected
category: authenticity
profile: mcuboot_swap_reference
secondary:
  name: v2.0.0-untrusted
  version: 2.0.0
  trusted: false
operation: stage_then_upgrade
backend: imgtool_verify
backend_args:
  image: v2.0.0-untrusted.signed.bin
  key_id: dev-trusted
fault:
  type: none
expect:
  invalid_image_booted: false
  verify_rejected: true
  outcome_in:
    - secure_refusal
notes: |
  An image signed with a key outside the trusted set must not verify with
  the trusted key.
