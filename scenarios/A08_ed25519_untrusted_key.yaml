id: A08
name: ed25519-untrusted-key-image-rejected
category: authenticity
profile: mcuboot_swap_ed25519_reference
secondary:
  name: v2.0.0-untrusted-ed25519
  version: 2.0.0
  trusted: false
operation: stage_then_upgrade
backend: imgtool_verify
backend_args:
  image: v2.0.0-untrusted-ed25519.signed.bin
  key_id: dev-trusted
  key_type: ed25519
fault:
  type: none
expect:
  invalid_image_booted: false
  verify_rejected: true
  outcome_in:
    - secure_refusal
notes: |
  Ed25519 variant of S02: an image signed with an untrusted key must be
  rejected by imgtool verify.
