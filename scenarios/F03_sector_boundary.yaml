id: F03
name: interrupt-at-sector-copy-boundary
category: fault
profile: mcuboot_swap_reference
primary:
  name: v1.0.0-trusted
  version: 1.0.0
  trusted: true
secondary:
  name: v2.0.0-trusted
  version: 2.0.0
  trusted: true
operation: stage_then_upgrade
backend: mcuboot_sim
backend_args:
  cargo_test: fault_campaign_upgrade
  cargo_features: sig-ecdsa
  env:
    FAULT_INDEX: "50"
fault:
  type: reset
  point: sector_copy_boundary
  index: 50
expect:
  invalid_image_booted: false
  outcome_in:
    - old_authenticated_image
    - new_authenticated_image
notes: |
  Representative interruption at a sector-copy boundary during the swap.
  The bootloader must resume and converge to a valid boot outcome.
