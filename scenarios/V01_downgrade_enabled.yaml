id: V01
name: downgrade-prevention-enabled-rejects-older
category: version
profile: mcuboot_policy_downgrade_enabled
primary:
  name: v2.0.0-trusted
  version: 2.0.0
  trusted: true
secondary:
  name: v1.5.0-trusted
  version: 1.5.0
  trusted: true
operation: stage_then_upgrade
backend: mcuboot_sim
backend_args:
  cargo_test: downgrade_prevention
  cargo_features: "sig-ecdsa downgrade-prevention overwrite-only"
fault:
  type: none
expect:
  invalid_image_booted: false
  outcome_in:
    - secure_refusal
notes: |
  With downgrade prevention enabled, an otherwise valid but older signed
  image must be rejected. The upstream proxy's internal assertion establishes
  secure refusal, but does not test a BootLab-declared image input directly.
