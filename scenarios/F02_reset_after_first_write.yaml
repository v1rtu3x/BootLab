id: F02
name: reset-after-first-successful-write-step
category: fault
profile: mcuboot_swap_reference
primary:
  name: v1.0.0-trusted
  version: 1.0.0
  trusted: true
secondary:
  name: v2.0.0-trusted
  version: 2.0.0
  trusted: true
operation: stage_then_upgrade
backend: mcuboot_sim
backend_args:
  cargo_test: fault_campaign_upgrade
  cargo_features: sig-ecdsa
  env:
    FAULT_INDEX: "1"
fault:
  type: reset
  point: after_first_successful_flash_write
  index: 1
expect:
  invalid_image_booted: false
  outcome_in:
    - old_authenticated_image
    - new_authenticated_image
  booted_version: "2.0.0"
notes: |
  Simulate power-loss after the first successful flash write step. On resume
  the bootloader must reach a documented recoverable state and converge to a
  valid boot outcome (typically the new image for a permanent upgrade).
