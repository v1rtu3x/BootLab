id: F02O
name: overwrite-interruption-before-first-counted-operation
category: fault
profile: mcuboot_overwrite_reference
primary:
  name: v1.0.0-trusted
  version: 1.0.0
  trusted: true
secondary:
  name: v2.0.0-trusted
  version: 2.0.0
  trusted: true
operation: stage_then_upgrade
backend: mcuboot_sim
backend_args:
  cargo_test: fault_campaign_upgrade
  cargo_features: "sig-ecdsa overwrite-only"
  env:
    FAULT_INDEX: "1"
fault:
  type: reset
  point: before_counted_operation_1
  index: 1
expect:
  invalid_image_booted: false
  outcome_in:
    - old_authenticated_image
    - new_authenticated_image
notes: |
  Interrupt before the first counted operation if the counter reaches it;
  evidence records whether the interruption point was reached.
