name: BootLab CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest

  corpus-and-matrix:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install package and imgtool
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ./vendor/mcuboot/scripts
      - name: Apply MCUboot simulator patches
        run: ./scripts/apply-mcuboot-patches.sh
      - name: Build image corpus
        run: bootlab build-corpus
      - name: Run assurance matrix
        run: bootlab run-matrix
      - name: Cross-profile comparison
        run: bootlab compare-profiles mcuboot_swap_reference mcuboot_overwrite_reference
      - name: Deterministic fault sweep
        run: bootlab fault-sweep --start 0 --end 10 --features sig-ecdsa
      - name: Sanitized report
        run: bootlab sanitize-report
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: assurance-evidence
          path: |
            evidence/report.md
            evidence/comparison.md
            evidence/report_sanitized.md
            evidence/fault_table.csv
            evidence/fault_table.json
