id: mcuboot_swap_ed25519_reference
name: MCUboot swap-scratch reference profile with Ed25519
bootloader:
  repository: https://github.com/mcu-tools/mcuboot
  commit: 229068b6d34688ddc7286c6d2056527b72f03cf4
  branch: main
  description: |
    Swap-with-scratch simulator configuration using Ed25519 signatures.
    Used to verify that the same assurance properties hold across signature
    algorithms.
device:
  name: nrf52840
  align: 8
  erased_value: 0xff
  primary_slot:
    base: 0x008000
    size: 0x034000
  secondary_slot:
    base: 0x03c000
    size: 0x034000
  scratch:
    base: 0x070000
    size: 0x00d000
signature:
  algorithm: ed25519
  key_id: dev-trusted
  public_key_hash_format: full
image:
  header_size: 0x200
  slot_size: 0x034000
  align: 8
  overwrite_only: false
  downgrade_prevention: false
security_counter:
  enabled: false
  initial: 1
features:
  - sig-ed25519
  - swap-scratch
notes: |
  Development-only Ed25519 signing keys are generated on first corpus build.
