[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "bootlab"
version = "0.1.0"
description = "Reproducible secure-boot and OTA update assurance lab around MCUboot"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "click==8.1.8",
    "cryptography==43.0.0",
    "pydantic==2.10.6",
    "PyYAML==6.0.2",
    "rich==13.9.4",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.2"]

[project.scripts]
bootlab = "bootlab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bootlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
