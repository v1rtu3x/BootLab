[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bootlab"
version = "0.1.0"
description = "Reproducible secure-boot and OTA update assurance lab around MCUboot"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "cryptography>=42.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "pytest>=7.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
bootlab = "bootlab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bootlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
